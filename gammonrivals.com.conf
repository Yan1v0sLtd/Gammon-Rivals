server {
    listen 443 ssl;
    server_name www.gammonrivals.com;

    include /config/nginx/ssl.conf;

    return 301 https://gammonrivals.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name gammonrivals.com;

    limit_req zone=ten burst=20;
    client_max_body_size 1m;

    include /config/nginx/ssl.conf;

    # --- Admin web (served from /admin) ---
    location = /admin {
        return 301 /admin/;
    }

    # SPA: no directory index, or asset dirs (lobby/, themes/, …) would 403 on a route name.
    location ^~ /admin/ {
        limit_req zone=ten burst=100;
        alias /config/www/gammonrivals.com/admin/;
        try_files $uri /admin/index.html;
    }

    # --- Public web ---
    # Static site: unknown paths must 404 so error_page can render Astro's 404.
    location / {
        root /config/www/gammonrivals.com/web;
        try_files $uri $uri/ =404;
    }

    # Real 404 status rendered with Astro's 404 page (status preserved).
    error_page 404 /404.html;

    location = /404.html {
        root /config/www/gammonrivals.com/web;
        internal;
    }
}
