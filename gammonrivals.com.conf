server {
    listen 443 ssl;
    server_name www.gammonrivals.com;

    include /config/nginx/ssl.conf;

    return 301 https://gammonrivals.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name gammonrivals.com;

    limit_req zone=ten burst=20;
    client_max_body_size 1m;

    include /config/nginx/ssl.conf;

    # --- Admin web (served from /admin) ---
    location = /admin {
        return 301 /admin/;
    }

    location ^~ /admin/ {
        limit_req zone=ten burst=100;
        alias /config/www/gammonrivals.com/admin;
        try_files $uri $uri/ /admin/index.html;
    }

    # --- Public web ---
    location / {
        root /config/www/gammonrivals.com/web;
        try_files $uri $uri/ /index.html =404;
    }

    # Real 404 status rendered with Astro's 404 page (status preserved).
    error_page 404 /404.html;
}
