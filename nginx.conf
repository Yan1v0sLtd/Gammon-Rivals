# nginx.conf - gammonrivals.com single-site config
#
# One HTTP server only; TLS terminates upstream (reverse proxy / CDN), so this
# server speaks plain HTTP on port 80. The Astro website build is the document
# root; the admin SPA build lives under /admin/. The game build (dist/play) is
# deliberately NOT served here.
#
# Route ownership:
#   /                     Astro website from dist/web - clean URLs resolve static
#                         files/dirs; unknown paths -> Astro 404, real 404 status
#                         (never a 200 SPA shell).
#   /_astro/*             Astro hashed assets from dist/web, immutable.
#   /admin -> /admin/     Canonical redirect to the admin SPA root.
#   /admin/*              Admin SPA from dist/admin; deep links fall back to
#                         /admin/index.html, scoped strictly to this prefix.
#   /admin/assets/*       Admin hashed assets, immutable, 404 when missing.
#   /sw.js                Service worker, no-store, never rewritten.
#   *.html                HTML responses revalidate (no-cache).
#   everything else       404 -> Astro 404 page.

worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile  on;

    server {
        listen       80;
        server_name  gammonrivals.com;

        # Redirects stay relative so a TLS-terminating proxy cannot receive an
        # "http://" Location for an "https://" request (browser keeps the scheme).
        absolute_redirect off;

        root   /srv/gammonrivals/dist/web;
        index  index.html;

        # Astro site. Clean URLs resolve via $uri/ (directory index); anything
        # unknown falls through to =404 and error_page renders Astro's 404.html
        # with a real 404 status (not a try_files ... /404.html 200 fallback).
        location / {
            try_files $uri $uri/ =404;
        }

        # Astro build assets are content-hashed -> immutable.
        location /_astro/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Admin SPA: canonical trailing slash.
        location = /admin {
            return 301 /admin/;
        }

        # Admin hashed assets. Missing assets must 404, not fall back to the SPA
        # shell. The longer prefix (with ^~) keeps these out of the generic
        # /admin/ fallback logic.
        location ^~ /admin/assets/ {
            alias  /srv/gammonrivals/dist/admin/assets/;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Admin SPA. alias maps /admin/<path> to dist/admin/<path>; the SPA
        # fallback is explicitly /admin/index.html, so a deep link like
        # /admin/some-route serves admin's index.html and can never leak into
        # the web root. HTML revalidates (index.html included).
        location ^~ /admin/ {
            alias  /srv/gammonrivals/dist/admin/;
            try_files $uri $uri/ /admin/index.html;
            add_header Cache-Control "no-cache";
        }

        # Service worker: never cached, never rewritten to the SPA shell.
        location = /sw.js {
            add_header Cache-Control "no-store";
        }

        # All HTML revalidates (page index files, 404.html, admin index). "always"
        # so the 404.html page also revalidates when served with a 404 status.
        location ~* \.html$ {
            add_header Cache-Control "no-cache" always;
        }

        # Real 404 status rendered with Astro's 404 page (status preserved).
        error_page 404 /404.html;
    }
}
