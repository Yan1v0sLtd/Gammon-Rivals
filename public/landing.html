<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#071120" />
    <title>Gammon Rivals — Play Backgammon Online</title>
    <meta
      name="description"
      content="Roll dice, race your checkers, win the match. Play backgammon online against real opponents or AI. Free to play."
    />

    <!-- Open Graph / social share -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Gammon Rivals — Play Backgammon Online" />
    <meta
      property="og:description"
      content="Roll dice, race your checkers, win the match. Play backgammon online against real opponents or AI."
    />
    <meta property="og:url" content="https://gammonrivals.com/" />
    <meta property="og:image" content="https://gammonrivals.com/lobby/backgrounds/classic-green.webp" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://gammonrivals.com/" />

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
        background: #071120;
        color: #f3ead3;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }

      .bg {
        position: fixed; inset: 0; z-index: -1;
        background-image: url('/lobby/backgrounds/classic-green.webp');
        background-size: cover;
        background-position: center;
        filter: brightness(0.55) saturate(1.05);
      }
      .bg::after {
        content: ""; position: absolute; inset: 0;
        background: radial-gradient(circle at 50% 35%, rgba(28, 127, 185, 0.28), rgba(5, 12, 24, 0.92) 62%, rgba(2, 8, 16, 0.98));
      }

      .stage {
        position: relative;
        min-height: 100dvh;
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: clamp(1rem, 3vw, 2.5rem);
        gap: clamp(1rem, 3vw, 2rem);
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }

      .brand {
        font-weight: 900;
        font-size: clamp(0.7rem, 1.2vw, 0.9rem);
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: #f6d770;
        text-shadow: 0 2px 8px rgba(0,0,0,0.45);
        text-decoration: none;
        /* Suppress the link cursor so the wordmark reads as a label,
           not a button. The header wordmark is a covert team entry to
           /play; visitors don't get a visual affordance. */
        cursor: default;
      }

      main {
        display: grid;
        place-items: center;
        text-align: center;
        gap: clamp(1.5rem, 4vw, 2.5rem);
      }

      .logo {
        width: 100%;
        max-width: clamp(18rem, 62vw, 36rem);
        height: auto;
        display: block;
        margin: 0 auto;
        filter: drop-shadow(0 14px 32px rgba(0, 0, 0, 0.55));
      }

      .play-btn {
        display: inline-grid;
        place-items: center;
        min-width: 14rem;
        height: 4rem;
        padding: 0 2.5rem;
        font-weight: 900;
        font-size: clamp(1.25rem, 2.5vw, 1.5rem);
        letter-spacing: 0.18em;
        text-transform: uppercase;
        text-decoration: none;
        color: #132109;
        border: 3px solid rgba(224, 255, 143, 0.95);
        border-radius: 9999px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.74) 0%, rgba(191, 255, 88, 0.86) 13%, transparent 39%),
          linear-gradient(180deg, #d6ff73 0%, #8cf244 40%, #20bd1f 68%, #07810d 100%);
        box-shadow:
          0 8px 0 #06450a,
          0 22px 38px rgba(0, 0, 0, 0.55),
          inset 0 3px 0 rgba(255, 255, 255, 0.74),
          inset 0 -7px 0 rgba(0, 78, 5, 0.4);
        text-shadow: 0 2px 0 rgba(255, 255, 255, 0.4);
        transition: transform 120ms ease, filter 120ms ease;
        cursor: pointer;
      }
      .play-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
      .play-btn:active { transform: translateY(3px); box-shadow: 0 4px 0 #06450a, 0 14px 28px rgba(0,0,0,0.5), inset 0 3px 0 rgba(255,255,255,0.74), inset 0 -5px 0 rgba(0,78,5,0.4); }

      /*
       * Pre-launch "Coming Soon" CTA. Same pill silhouette as
       * .play-btn but visually passive: gold outline on dark
       * fill, no hover/active states, default cursor. When the
       * game is ready, swap the <span class="cta-soon"> back to
       * <a class="play-btn" href="/play">Play Now</a>.
       */
      .cta-soon {
        display: inline-grid;
        place-items: center;
        min-width: 14rem;
        height: 4rem;
        padding: 0 2.5rem;
        font-weight: 900;
        font-size: clamp(1.1rem, 2.2vw, 1.35rem);
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #f6d770;
        border: 2px solid rgba(246, 215, 112, 0.55);
        border-radius: 9999px;
        background:
          linear-gradient(180deg, rgba(70, 50, 18, 0.55) 0%, rgba(20, 12, 4, 0.7) 100%);
        box-shadow:
          0 10px 28px rgba(0, 0, 0, 0.5),
          inset 0 1px 0 rgba(255, 235, 180, 0.2);
        text-shadow: 0 1px 0 rgba(0, 0, 0, 0.55);
        cursor: default;
        user-select: none;
      }
      @media (max-width: 480px) {
        .cta-soon { width: 100%; max-width: 22rem; }
      }

      footer {
        display: flex;
        justify-content: center;
        gap: 1.5rem;
        font-size: 0.78rem;
        color: rgba(243, 234, 211, 0.55);
      }
      footer a { color: inherit; text-decoration: none; }
      footer a:hover { color: #f6d770; }

      @media (max-width: 480px) {
        .play-btn { width: 100%; max-width: 22rem; }
      }
    </style>
  </head>

  <body>
    <div class="bg" aria-hidden="true"></div>

    <div class="stage">
      <header>
        <!-- Pre-launch covert team entry: the wordmark is a quiet link
             to /play. Looks like a label (cursor: default, no underline)
             so visitors don't see a Sign In affordance. At launch,
             restore the explicit Sign In on the right:
               <a class="brand" href="/play">Sign In →</a>
        -->
        <a class="brand" href="/play">Gammon Rivals</a>
      </header>

      <main>
        <img
          class="logo"
          src="/brand/logo.webp"
          alt="Gammon Rivals — Roll. Strategize. Win."
        />
        <span class="cta-soon">Coming Soon</span>
      </main>

      <footer>
        <span>© Gammon Rivals</span>
        <!-- Sign-in link intentionally removed pre-launch. Add back as:
             <a href="/play">Sign In</a>
        -->
      </footer>
    </div>
  </body>
</html>
