packages:
  - .

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

shellEmulator: true

# DO NOT REMOVE THIS LINE
storeDir: ${PNPM_STORE_DIR}

supportedArchitectures:
  cpu: [ arm64, x64 ]
  os: [ darwin, linux ]

updateNotifier: false

engineStrict: true
saveExact: true

minimumReleaseAgeExclude:
  - tar@7.5.3 || 7.5.4 || 7.5.7 || 7.5.8 || 7.5.10 || 7.5.11 || 7.5.16 || 7.5.17 || 7.5.18 || 7.5.19 || 7.5.21
  - minimatch@3.1.3 || 3.1.4
  - uuid@11.1.1
  - sharp@0.35.3

overrides:
  minimatch@<3.1.3: ^3.1.3
  minimatch@<3.1.4: ^3.1.4
  sharp@<0.35.0: ^0.35.3
  tar@<7.5.7: ^7.5.7
  tar@<7.5.8: ^7.5.8
  tar@<=7.5.10: ^7.5.11
  tar@<=7.5.15: ^7.5.16
  tar@<=7.5.16: ^7.5.17
  tar@<=7.5.17: ^7.5.18
  tar@<=7.5.18: ^7.5.19
  tar@<=7.5.2: ^7.5.3
  tar@<=7.5.20: ^7.5.21
  tar@<=7.5.3: ^7.5.4
  tar@<=7.5.9: ^7.5.10
  uuid@<11.1.1: ^11.1.1
