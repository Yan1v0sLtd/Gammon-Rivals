name: CI

# Quality gate for an auto-deploying repo: every push to main and every PR runs
# a typecheck+build and the test suite. Configure Vercel (or branch protection)
# to require the "verify" check before a production deploy so a broken commit
# can't ship to gammonrivals.com. Lint runs but is non-blocking for now (there
# is pre-existing lint debt — see the audit; tighten to blocking once cleaned).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkput
        uses: actions/checkout@v6
      - name: install pnpm and node
        uses: pnpm/setup@v2
        with:
          version: 11.20.0
          runtime: node@24
          install: false
          token: ""
      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: /pnpm/store
          key: pnpm-install-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-install-
      - name: Install dependencies
        #        working-directory: web
        run: pnpm install --frozen-lockfile --store-dir "$PNPM_STORE_DIR"
      - name: Tests (blocking)
        run: pnpm test
      - name: Lint (non-blocking — pre-existing debt)
        run: pnpm lint
        continue-on-error: true
